version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: interview_prep_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: POSTGRES_PASSWORD
      POSTGRES_DB: interview_prep_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    image: ${BACKEND_IMAGE:-interview-prep-backend}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_prep_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://postgres:POSTGRES_PASSWORD@postgres:5432/interview_prep_db
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      - postgres

  frontend:
    image: ${FRONTEND_IMAGE:-interview-prep-frontend}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: interview_prep_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: